apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-layer1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: client-layer1
  template:
    metadata:
      labels:
        app: client-layer1
    spec:
      containers:
        - name: client
          image: minhbui1/client:v2.0.0
          command: ["sh", "-c", "sleep 20 && python client.py --layer_id 1 --device cpu"]
          volumeMounts:
            - name: config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: app-config

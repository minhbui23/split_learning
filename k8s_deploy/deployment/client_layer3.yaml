apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-layer3
  namespace: split-learning
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client-layer3
  template:
    metadata:
      labels:
        app: client-layer3
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/hostname: worker3
      containers:
        - name: client
          image: minhbui1/client:v2.0.0
          command: ["sh", "-c", "sleep 10 && python -u client.py --layer_id 3 --device cpu"]
          resources:
            limits:
              cpu: "1.5"
              memory: "3Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          volumeMounts:
          - name: config-volume
            mountPath: /app/config.yaml
            subPath: config.yaml
      volumes:
        - name: config-volume
          configMap:
            name: split-learning-config
